name: Self-host deploy

# Manual Cloudflare self-host deploy for this fork. Secrets stay in GitHub
# Actions secrets (see SELFHOST_NOTES.md) and are never printed.
#
# Required repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and
# ENV_SELFHOST (the full .env.selfhost file). CI=true makes alchemy read the
# Cloudflare token and account id from the environment. Bootstrap is safe to
# re-run; it provisions alchemy's state-store Worker.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-deploy
  cancel-in-progress: false

env:
  CI: true
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write .env.selfhost
        env:
          ENV_SELFHOST: ${{ secrets.ENV_SELFHOST }}
        run: |
          if [ -z "$ENV_SELFHOST" ]; then
            echo "::error::ENV_SELFHOST secret is empty"
            exit 1
          fi
          printf '%s' "$ENV_SELFHOST" > .env.selfhost

      - name: Bootstrap Alchemy state store
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set"
            exit 1
          fi
          pnpm alchemy cloudflare bootstrap

      - name: Deploy self-host stage
        run: pnpm deploy:selfhost --yes

      # Fail if the worker answers without a Cloudflare Access login redirect.
      # Retries cover workers.dev propagation. Then print /api/health when it
      # responds; Access may intercept it, and that does not fail the deploy.
      - name: Verify Access protection
        run: |
          url="https://open-seo-selfhost.tcrxx0.workers.dev"
          verified=0
          for attempt in 1 2 3 4 5 6 7 8; do
            response=$(curl -sS -o /dev/null -m 10 -w '%{http_code} %{redirect_url}' "$url") || response=""
            code="${response%% *}"
            location="${response#* }"
            case "$location" in
              https://*.cloudflareaccess.com/cdn-cgi/access/login*)
                echo "Cloudflare Access login redirect verified for $url"
                verified=1
                break ;;
            esac
            if [ -n "$code" ] && [ "$code" -ge 200 ] && [ "$code" -lt 500 ] && [ "$code" != 404 ]; then
              echo "::error::$url responded (HTTP $code) WITHOUT a Cloudflare Access challenge"
              exit 1
            fi
            echo "attempt $attempt: not up yet (${response:-no response})"
            sleep 5
          done
          if [ "$verified" -ne 1 ]; then
            echo "::error::Could not verify Cloudflare Access protection for $url after 8 attempts"
            exit 1
          fi
          health_url="${url}/api/health"
          if health=$(curl -sS -o /dev/null -m 10 -w '%{http_code} %{redirect_url}' "$health_url"); then
            echo "/api/health status: ${health}"
          else
            echo "/api/health: not reachable"
          fi
